name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: mv app/build/outputs/apk/debug/app-debug.apk TwitchUnblock-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TwitchUnblock-TV
          path: TwitchUnblock-TV.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TwitchUnblock TV (última versión)
          files: TwitchUnblock-TV.apk
